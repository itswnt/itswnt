name: FNAF
options:
  deploymentTarget:
    iOS: "15.0"
targets:
  FNAF:
    type: application
    platform: iOS
    sources:
      - path: App/App.swift
      - path: App/Assets.xcassets
      - path: App/Web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mykid101511.fnaf
        INFOPLIST_FILE: App/Info.plist
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
    scheme: {}
